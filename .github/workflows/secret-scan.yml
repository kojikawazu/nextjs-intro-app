name: Secret scan

# 変更種別を問わず常に実行する。どの分類の変更でも秘匿ファイルは混入しうるため、
# ワークフローレベルの paths / paths-ignore で絞らない。
#
# ブランチ保護の必須チェックに含める場合、ここを paths で止めないこと。
# ワークフローが起動しないと必須チェックが pending のままになり PR がマージできなくなる
# （ジョブレベルの if: によるスキップは "skipped" となり成功扱いになるため問題ない）。
#
# main への push でも走らせるのは、PR を経由しない経路（管理者による直接 push や
# ブランチ保護の一時解除）で混入した場合の取りこぼしを防ぐため。
on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    secret-scan:
        name: Secret scan
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            # 検出ロジックは scripts/secret-scan.sh に置く（ローカルでも同じ判定を再現するため）。
            # 判定が壊れると本番のスキャンは「常に OK」になり誰も気づけないため、
            # 先に検出対象・誤検知・.gitignore の除外をテストで確かめてから本番を走らせる。
            - name: Test secret scan rules
              run: bash scripts/secret-scan.test.sh

            # git ls-files / git grep はインデックスと追跡ファイルだけを読み、履歴は走査しない。
            # そのため shallow clone（fetch-depth: 1）のままで十分速く、常時実行にできる。
            #
            # 検出するのは「秘匿ファイルが Git の追跡対象に入っていないか」（名前と、GCP SA キーの
            # JSON 構造）。任意のトークン文字列の検出は GitHub の secret scanning に任せる（docs/06 §11）。
            - name: Assert no secret files are tracked
              run: bash scripts/secret-scan.sh
