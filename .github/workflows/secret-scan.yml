name: Secret scan

# 変更種別を問わず常に実行する。どの分類の変更でも秘匿ファイルは混入しうるため、
# ワークフローレベルの paths / paths-ignore で絞らない。
#
# ブランチ保護の必須チェックに含める場合、ここを paths で止めないこと。
# ワークフローが起動しないと必須チェックが pending のままになり PR がマージできなくなる
# （ジョブレベルの if: によるスキップは "skipped" となり成功扱いになるため問題ない）。
#
# main への push でも走らせるのは、PR を経由しない経路（管理者による直接 push や
# ブランチ保護の一時解除）で混入した場合の取りこぼしを防ぐため。
on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    secret-scan:
        name: Secret scan
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            # git ls-files はインデックスを読むだけで、履歴もワーキングツリーも走査しない。
            # そのため shallow clone（fetch-depth: 1）のままで十分速く、常時実行にできる。
            #
            # 検出するのは「秘匿ファイルが Git の追跡対象に入っていないか」であって、
            # ファイルの中身ではない。値の検出は GitHub の secret scanning に任せる
            # （docs/06 §11 を参照）。
            - name: Assert no secret files are tracked
              run: |
                  tracked=$(git ls-files \
                    | grep -E '(^|/)(\.env(\..+)?|[^/]+\.(key|pem|p12|pfx|jks|keystore)|id_rsa|id_ed25519|id_dsa|credentials\.json|serviceAccountKey\.json)$' \
                    | grep -vE '\.(example|sample|template|dist)$|\.env\.d\.ts$') || true
                  if [ -n "$tracked" ]; then
                    echo "::error::秘匿ファイルが Git 管理下にあります。.gitignore への追加では履歴から消えないため、鍵・トークンのローテーションが必要になります。"
                    echo "$tracked"
                    exit 1
                  fi
                  echo "OK: 追跡対象に秘匿ファイルはありません"
