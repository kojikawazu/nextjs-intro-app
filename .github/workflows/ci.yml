name: CI

on:
    pull_request:
        branches:
            - main
    workflow_dispatch:

jobs:
    quality:
        name: Quality checks
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  # testcontainers（→ undici@8）が Node >= 22.19 を要求するため 24 を使用。
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Type check (tsc --noEmit)
              run: pnpm type-check

            - name: Lint (ESLint + JSDoc)
              run: pnpm lint

            - name: Format check (Prettier)
              run: pnpm format:check

            # 依存監査は「止める基準」と「見せる基準」を分ける。
            #
            # ブロッキング: 本番依存（--prod）の critical のみ。devDependency 経由の指摘は
            # 本番コンテナに含まれず、eslint / vitest / testcontainers 等の間接依存で数が多いため、
            # ここで止めると PR がすべてブロックされて監査そのものが形骸化する。
            #
            # 実測（2026-09-19 時点）: 全依存 48 件 / 本番依存のみ 11 件 / critical 0 件。
            # 本番依存の high 6 件を解消できた段階で、この閾値を high へ引き上げる。
            - name: Audit (blocking - production deps, critical only)
              run: pnpm audit:ci

            # 可視化のみ。critical 未満の指摘を CI ログに残すが、ここでは CI を落とさない。
            - name: Audit (informational - production deps, all levels)
              run: pnpm audit
              continue-on-error: true

            - name: Test (Vitest)
              run: pnpm test:run

            # 統合テスト。Testcontainers が fake-gcs-server コンテナを起動する
            # （GitHub Actions の ubuntu runner は Docker 利用可）。Resend は MSW でモック。
            - name: Integration test (Testcontainers + MSW)
              run: pnpm test:it
              env:
                  # ephemeral な CI runner では reaper 不要。起動失敗による flaky を避けるため無効化。
                  TESTCONTAINERS_RYUK_DISABLED: 'true'
