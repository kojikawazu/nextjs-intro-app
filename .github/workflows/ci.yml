name: CI

on:
    pull_request:
        branches:
            - main
    workflow_dispatch:

jobs:
    quality:
        name: Quality checks
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  # testcontainers（→ undici@8）が Node >= 22.19 を要求するため 24 を使用。
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Type check (tsc --noEmit)
              run: pnpm type-check

            - name: Lint (ESLint + JSDoc)
              run: pnpm lint

            - name: Format check (Prettier)
              run: pnpm format:check

            - name: Test (Vitest)
              run: pnpm test:run

            # 統合テスト。Testcontainers が fake-gcs-server コンテナを起動する
            # （GitHub Actions の ubuntu runner は Docker 利用可）。Resend は MSW でモック。
            - name: Integration test (Testcontainers + MSW)
              run: pnpm test:it
              env:
                  # ephemeral な CI runner では reaper 不要。起動失敗による flaky を避けるため無効化。
                  TESTCONTAINERS_RYUK_DISABLED: 'true'
