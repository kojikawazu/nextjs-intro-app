name: CI

on:
    pull_request:
        branches:
            - main
    workflow_dispatch:

jobs:
    quality:
        name: Quality checks
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  # 本番（Dockerfile: node:24-alpine）と揃える。package.json の
                  # engines.node が正本（issue #130）。
                  #
                  # 下限を決めているのは testcontainers（→ undici@8）の Node >= 22.19。
                  # next@16 の >= 20.9 より厳しいため、こちらが効く。
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Type check (tsc --noEmit)
              run: pnpm type-check

            - name: Lint (ESLint + JSDoc)
              run: pnpm lint

            - name: Format check (Prettier)
              run: pnpm format:check

            # Markdown の静的検査。Prettier は .prettierignore で Markdown を対象外に
            # しているため（*.md / docs/ / .claude/）、整形の担い手が居らず両者は競合しない。
            #
            # 既定ルールのままでは 3,126 件の違反が出る。件数の 93% を占める MD060
            # （テーブルのパイプ整形）/ MD013（1行80文字）/ MD007（箇条書きインデント）は
            # 日本語ドキュメントの書き方と正面から衝突するため無効化している。
            # 取捨選択の根拠は .markdownlint-cli2.jsonc のコメントと docs/10 を参照。
            - name: Lint Markdown (markdownlint-cli2)
              run: pnpm lint:md

            # ワークフロー定義そのものを検証する。式の誤り・存在しないランナーラベル・
            # 未定義のコンテキスト参照に加え、`run:` ブロックを shellcheck に掛ける。
            # deploy_to_googlecloud.yml は古いイメージ削除のシェルスクリプトを直接持つため、
            # そこの構文ミスが本番デプロイまで気づかれない状態だった。
            #
            # バージョンを固定しているのは、ローカルで検出（exit 1）と非検出（exit 0）の
            # 両方を実証した版と同じ挙動を CI で保証するため。
            - name: Lint GitHub Actions workflows (actionlint)
              run: |
                  docker run --rm -v "$PWD":/repo --workdir /repo \
                    rhysd/actionlint:1.7.12 -color

            # 依存監査は「止める基準」と「見せる基準」を分ける。
            #
            # ブロッキング: 本番依存（--prod）の critical のみ。devDependency 経由の指摘は
            # 本番コンテナに含まれず、eslint / vitest / testcontainers 等の間接依存で数が多いため、
            # ここで止めると PR がすべてブロックされて監査そのものが形骸化する。
            #
            # 実測（2026-09-19 時点）: 全依存 48 件 / 本番依存のみ 11 件 / critical 0 件。
            # 本番依存の high 6 件を解消できた段階で、この閾値を high へ引き上げる。
            - name: Audit (blocking - production deps, critical only)
              run: pnpm audit:ci

            # 可視化のみ。dev 依存を含む全件をログに残すが、ここでは CI を落とさない。
            # スクリプト名は組み込みの `pnpm audit` と衝突しないよう `audit:prod` にしている
            # （`pnpm audit` と書くと package.json のスクリプトではなく組み込みが実行され、
            #  `--prod` が効かない）。ここでは全依存を見たいので組み込みをそのまま使う。
            - name: Audit (informational - all deps, all levels)
              run: pnpm audit
              continue-on-error: true

            - name: Test (Vitest)
              run: pnpm test:run

            # 統合テスト。Testcontainers が fake-gcs-server コンテナを起動する
            # （GitHub Actions の ubuntu runner は Docker 利用可）。Resend は MSW でモック。
            - name: Integration test (Testcontainers + MSW)
              run: pnpm test:it
              env:
                  # ephemeral な CI runner では reaper 不要。起動失敗による flaky を避けるため無効化。
                  TESTCONTAINERS_RYUK_DISABLED: 'true'
