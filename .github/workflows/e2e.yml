name: E2E

# E2E は UT/IT より重い（ブラウザ + build + Docker）ため、ci.yml とは別ワークフローに分離。
on:
    pull_request:
        branches:
            - main
    workflow_dispatch:

jobs:
    e2e:
        name: E2E (Playwright + GCS container)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  # 本番（Dockerfile: node:24-alpine）と揃える。package.json の
                  # engines.node が正本（issue #130）。
                  #
                  # 下限を決めているのは testcontainers（→ undici@8）の Node >= 22.19。
                  # next@16 の >= 20.9 より厳しいため、こちらが効く。
                  node-version: 24
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Playwright browser (chromium)
              run: pnpm exec playwright install --with-deps chromium

            - name: Build
              run: pnpm build

            - name: Run E2E
              run: pnpm test:e2e
              env:
                  # ephemeral な CI runner では reaper 不要。起動失敗による flaky を避けるため無効化。
                  TESTCONTAINERS_RYUK_DISABLED: 'true'

            - name: Upload Playwright report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 7
